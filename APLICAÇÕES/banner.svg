<svg width="1100" height="300" viewBox="0 0 1100 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Banner do repositório Deploy Apps MS32</title>
<desc>Banner escuro com grade sutil de fundo, barra ciano lateral, selo com ícone de pacote, título "Deploy Apps MS32", subtítulo e tags Intune, PowerShell, Empacotamento, Automação.</desc>
<defs>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
<path d="M28 0 L0 0 L0 28" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
</pattern>
<clipPath id="clipB"><rect x="0" y="0" width="1100" height="300" rx="10"/></clipPath>
</defs>

<g clip-path="url(#clipB)">
<rect x="0" y="0" width="1100" height="300" fill="#081226"/>
<rect x="0" y="0" width="1100" height="300" fill="url(#grid)"/>

<g stroke="#2dd4c8" stroke-opacity="0.5" stroke-width="1.5" fill="none">
<line x1="980" y1="70" x2="1020" y2="110"/>
<line x1="1020" y1="110" x2="1000" y2="160"/>
<line x1="1000" y1="160" x2="1050" y2="200"/>
</g>
<g fill="#2dd4c8">
<circle cx="980" cy="70" r="5"/>
<circle cx="1020" cy="110" r="5"/>
<circle cx="1000" cy="160" r="5"/>
<circle cx="1050" cy="200" r="5"/>
</g>

<rect x="0" y="0" width="8" height="300" fill="#2dd4c8"/>

<g transform="translate(70,90)">
<path d="M55 0 L110 22 L110 75 Q110 130 55 155 Q0 130 0 75 L0 22 Z" fill="#0d2c55" stroke="#2dd4c8" stroke-width="2"/>
<path d="M33 78 L48 95 L82 55" fill="none" stroke="#2dd4c8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</g>

<text x="230" y="115" font-size="42" font-weight="500" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif">Deploy apps</text>
<text x="230" y="163" font-size="42" font-weight="500" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif"><tspan fill="#2dd4c8">ms32</tspan></text>
<text x="230" y="196" font-size="15" fill="#9fb3cc" font-family="Segoe UI, Arial, sans-serif">Empacotamento, distribuição e automação de instalação de aplicativos</text>

<g font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#2dd4c8">
<rect x="230" y="215" width="82" height="30" rx="15" fill="#0d2c55" stroke="#2dd4c8" stroke-width="1"/>
<text x="271" y="234" text-anchor="middle">Intune</text>
<rect x="322" y="215" width="122" height="30" rx="15" fill="#0d2c55" stroke="#2dd4c8" stroke-width="1"/>
<text x="383" y="234" text-anchor="middle">PowerShell</text>
<rect x="454" y="215" width="150" height="30" rx="15" fill="#0d2c55" stroke="#2dd4c8" stroke-width="1"/>
<text x="529" y="234" text-anchor="middle">Empacotamento</text>
<rect x="614" y="215" width="120" height="30" rx="15" fill="#0d2c55" stroke="#2dd4c8" stroke-width="1"/>
<text x="674" y="234" text-anchor="middle">Automação</text>
</g>
</g>

<rect x="0" y="0" width="1100" height="300" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
</svg>
