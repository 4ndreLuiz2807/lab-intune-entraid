  <path d="M116 116h45v45z" fill="#f28c00" opacity=".95"/>
  <path d="M145 145h48v48z" fill="#9acb23" opacity=".95"/>
</g>

<text x="365" y="225" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="700" fill="#63a51c">QGIS</text>
<text x="372" y="278" font-family="Arial, Helvetica, sans-serif" font-size="29" letter-spacing="5" fill="#263743">GEOSPATIAL OPEN SOURCE</text>
