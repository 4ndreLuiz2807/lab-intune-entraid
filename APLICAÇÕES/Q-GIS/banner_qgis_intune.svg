<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop stop-color="#78b82a"/><stop offset="1" stop-color="#4b8f18"/></linearGradient>
  <linearGradient id="b" x1="0" x2="1"><stop stop-color="#23313a"/><stop offset="1" stop-color="#14232d"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#6aa520" stroke-opacity=".08"/>
  </pattern>
</defs>

<rect width="1600" height="500" fill="#fff"/>
<rect width="1600" height="500" fill="url(#grid)"/>

<!-- left accent -->
<path d="M0 0H470L390 80H0Z" fill="url(#b)"/>
<path d="M0 91H395L480 6" fill="none" stroke="#76ad27" stroke-width="3"/>

