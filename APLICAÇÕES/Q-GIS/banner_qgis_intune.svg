  <rect x="0" y="-38" width="68" height="48" rx="2"/>
  <rect x="54" y="-20" width="34" height="55" rx="2"/>
  <path d="M20 22h30M35 10v12"/>
</g>
<text x="225" y="413" font-family="Arial, Helvetica, sans-serif" font-size="31" fill="#2776bd">Microsoft Intune</text>
<line x1="470" y1="375" x2="470" y2="438" stroke="#8b969d"/>
<text x="500" y="402" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#263743">Deploy corporativo via</text>
<text x="500" y="430" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#263743">Windows Win32 App (.intunewin)</text>

<!-- right globe -->
<g transform="translate(1120 85)" fill="none" stroke="#6aa520" stroke-width="3">
  <circle cx="145" cy="145" r="115"/>
  <ellipse cx="145" cy="145" rx="52" ry="115"/>
  <path d="M30 145h230M50 90h190M50 200h190"/>
  <ellipse cx="145" cy="145" rx="175" ry="68" transform="rotate(-22 145 145)"/>
  <circle cx="310" cy="83" r="8" fill="#6aa520" stroke="none"/>
</g>

<!-- right labels/icons -->
<g font-family="Arial, Helvetica, sans-serif" fill="#263743" text-anchor="middle">
  <g transform="translate(1030 355)">
    <path d="M0-32l18-12 18 12 18-12v48L36 16 18 4 0 16z" fill="none" stroke="#63a51c" stroke-width="3"/>
