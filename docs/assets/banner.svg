<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1929"/>
      <stop offset="55%" stop-color="#0f2942"/>
      <stop offset="100%" stop-color="#0a1929"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a4ef"/>
      <stop offset="100%" stop-color="#0078d4"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- Faixa de destaque -->
  <rect x="0" y="0" width="8" height="300" fill="url(#accent)"/>

  <!-- Icone abstrato: escudo com check, remete a seguranca/gerenciamento -->
  <g transform="translate(90,90)">
    <path d="M60 0 L118 22 V70 C118 108 92 132 60 148 C28 132 2 108 2 70 V22 Z"
          fill="#0f3a5f" stroke="url(#accent)" stroke-width="4"/>
    <path d="M35 74 L54 93 L90 50" fill="none" stroke="#00e5c7" stroke-width="8"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Pontos de conexao decorativos -->
  <circle cx="1060" cy="60" r="5" fill="#00a4ef" opacity="0.8"/>
  <circle cx="1110" cy="95" r="4" fill="#00e5c7" opacity="0.7"/>
  <circle cx="1130" cy="150" r="6" fill="#0078d4" opacity="0.8"/>
  <circle cx="1080" cy="200" r="4" fill="#00a4ef" opacity="0.6"/>
  <circle cx="1150" cy="230" r="5" fill="#00e5c7" opacity="0.7"/>
  <line x1="1060" y1="60" x2="1110" y2="95" stroke="#0078d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1110" y1="95" x2="1130" y2="150" stroke="#0078d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1130" y1="150" x2="1080" y2="200" stroke="#0078d4" stroke-opacity="0.35" stroke-width="1.5"/>
  <line x1="1080" y1="200" x2="1150" y2="230" stroke="#0078d4" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Texto principal -->
  <text x="290" y="120" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Laboratório Intune
  </text>
  <text x="290" y="168" font-family="Segoe UI, Verdana, sans-serif" font-size="46" font-weight="700" fill="#ffffff">
    Entra ID <tspan fill="#00a4ef">&amp;</tspan> Microsoft 365
  </text>

  <!-- Subtitulo -->
  <text x="292" y="205" font-family="Segoe UI, Verdana, sans-serif" font-size="19" fill="#8fb8d8">
    Registros, boas práticas e troubleshooting em endpoint management
  </text>

  <!-- Tags -->
  <g font-family="Segoe UI, Verdana, sans-serif" font-size="14" font-weight="600">
    <rect x="292" y="228" width="88" height="28" rx="14" fill="#0f3a5f" stroke="#0078d4" stroke-width="1"/>
    <text x="336" y="247" fill="#7fd4ff" text-anchor="middle">Intune</text>

    <rect x="390" y="228" width="102" height="28" rx="14" fill="#0f3a5f" stroke="#0078d4" stroke-width="1"/>
    <text x="441" y="247" fill="#7fd4ff" text-anchor="middle">Entra ID</text>

    <rect x="502" y="228" width="128" height="28" rx="14" fill="#0f3a5f" stroke="#0078d4" stroke-width="1"/>
    <text x="566" y="247" fill="#7fd4ff" text-anchor="middle">Zero Trust</text>

    <rect x="640" y="228" width="132" height="28" rx="14" fill="#0f3a5f" stroke="#0078d4" stroke-width="1"/>
    <text x="706" y="247" fill="#7fd4ff" text-anchor="middle">PowerShell</text>
  </g>
</svg>
